# WaterExpert reverse proxy (review item 25).
#
# nginx terminates TLS and forwards every request to the app container, which
# serves the static frontend at `/ui` and the API at `/api/v1/*`. One upstream
# keeps the same-origin contract the exported frontend relies on (relative
# `/api/v1/...` calls) intact behind a single public hostname.
#
# TLS certificates are expected at /etc/nginx/certs/{server.crt,server.key}.
# Generate a self-signed pair for staging with:
#
#   mkdir -p certs && openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/server.key -out certs/server.crt \
#     -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#
# then `docker compose up`. Swap in a real CA-signed certificate for production.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json
        '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent","rt":$request_time}';
    access_log /var/log/nginx/access.log json;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 600m;   # uploads may be large; the app enforces its own cap

    # Only one scheduler may run at a time (the app's single-process job queue),
    # so a single app upstream is the safe default. Scale horizontally only for
    # stateless reads — see docs for the multi-instance constraint.
    upstream waterexpert_app {
        server app:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Health checks are public so an orchestrator can probe them without a token.
        location = /healthz { proxy_pass http://waterexpert_app; }
        location = /readyz  { proxy_pass http://waterexpert_app; }

        # Everything else rides HTTPS.
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Do not let the backend see the client as the proxy itself; forward the
        # real address so the audit log records who actually called.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass         http://waterexpert_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 3600s;   # long-running analysis jobs poll over this connection
        }
    }
}
