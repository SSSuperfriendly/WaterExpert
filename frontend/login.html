<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterExpert | 登录</title>
  <link rel="stylesheet" href="/ui/styles.css?v=20260702-login-copy">
</head>
<body data-page="login">
  <main class="login-shell">
    <section class="login-stage">
      <div class="login-visual" aria-hidden="true">
        <img class="login-stage-image" src="/ui/assets/login-background.png" alt="">
      </div>

      <section class="login-auth-panel" aria-label="登录窗口">
        <div class="login-card login-card-compact">
          <div class="login-card-head">
            <h1 class="login-card-title">登录</h1>
            <button id="themeToggleButton" class="button button-secondary theme-toggle login-theme-button" type="button">夜间</button>
          </div>

          <form id="loginForm" class="login-form login-form-compact">
            <label class="field login-field">
              <span>账号</span>
              <div class="login-input-shell">
                <span class="login-input-icon login-input-icon-user" aria-hidden="true"></span>
                <input id="loginUsername" type="text" autocomplete="username" placeholder="请输入账号" required>
              </div>
            </label>

            <label class="field login-field">
              <span>密码</span>
              <div class="login-input-shell">
                <span class="login-input-icon login-input-icon-lock" aria-hidden="true"></span>
                <input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入密码" required>
                <button id="passwordToggleButton" class="login-input-toggle" type="button" aria-label="显示密码" title="显示密码"></button>
              </div>
            </label>

            <div class="login-actions">
              <button id="fillDemoButton" type="button" class="button button-secondary login-fill-button">一键进入系统</button>
              <button id="loginSubmitButton" type="submit" class="button button-primary login-submit-button">进入系统</button>
            </div>
          </form>

          <p id="loginHint" class="login-hint login-hint-inline">正在加载演示账号提示...</p>
          <p id="loginStatus" class="login-status" aria-live="polite"></p>
          <p id="loginError" class="login-error" aria-live="polite"></p>
        </div>
      </section>
    </section>
  </main>

  <script type="module" src="/ui/js/login.js?v=20260702-login-copy" defer></script>
</body>
</html>
