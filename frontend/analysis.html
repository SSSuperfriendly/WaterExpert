<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterExpert | 诊断分析</title>
  <link rel="stylesheet" href="/ui/styles.css?v=20260605-modular-theme">
</head>
<body data-page="analysis">
  <div class="workspace-shell">
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="关闭导航"></button>

    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="/ui/index.html">
          <span class="brand-mark">WE</span>
          <span class="brand-text">WaterExpert</span>
        </a>
      </div>
      <nav class="side-nav" aria-label="主导航">
        <a class="side-link" href="/ui/index.html"><span class="side-link-index">01</span><span class="side-link-text">总览</span></a>
        <a class="side-link" href="/ui/data.html"><span class="side-link-index">02</span><span class="side-link-text">数据</span></a>
        <a class="side-link" href="/ui/jobs.html"><span class="side-link-index">03</span><span class="side-link-text">任务</span></a>
        <a class="side-link active" href="/ui/analysis.html"><span class="side-link-index">04</span><span class="side-link-text">诊断</span></a>
      </nav>
      <div class="sidebar-foot">
        <p id="sidebarContext" class="sidebar-context">因子与边界</p>
      </div>
    </aside>

    <button id="sidebarEdgeToggle" class="edge-toggle" type="button" aria-label="折叠侧栏" title="折叠侧栏" data-state="expanded">
      <span class="toggle-glyph" aria-hidden="true"></span>
      <span class="sr-only">折叠侧栏</span>
    </button>

    <div class="content-shell">
      <header class="toolbar">
        <div class="toolbar-main">
          <button id="sidebarToggleMobile" class="sidebar-toggle mobile-only" type="button" aria-label="打开导航">导航</button>
          <div>
            <h1>诊断分析</h1>
          </div>
        </div>
        <div class="toolbar-actions">
          <p id="runtimeMeta" class="runtime-meta"></p>
          <button id="themeToggleButton" class="button button-secondary theme-toggle" type="button" aria-label="切换到夜间模式" title="切换到夜间模式">夜间</button>
          <button id="refreshButton" class="button button-secondary">刷新</button>
          <button id="exportReportButton" class="button button-primary">导出报告</button>
        </div>
      </header>

      <div id="statusBanner" class="status-banner hidden"></div>

      <main class="analysis-layout">
        <section class="panel panel-wide analysis-hero">
          <div class="analysis-hero-copy">
            <span id="analysisFocusChip" class="scope-chip"></span>
            <h2 id="analysisLeadTitle" class="analysis-lead-title"></h2>
            <p id="analysisLeadText" class="analysis-lead-text"></p>
          </div>
          <div id="analysisHeroStats" class="analysis-hero-stats"></div>
          <div id="analysisActionCards" class="analysis-action-grid"></div>
        </section>

        <div class="analysis-tabbar" role="tablist" aria-label="诊断视图">
          <button class="analysis-tab is-active" type="button" role="tab" aria-selected="true" data-analysis-tab="diagnosis">诊断结论</button>
          <button class="analysis-tab" type="button" role="tab" aria-selected="false" data-analysis-tab="thresholds">阈值与边界</button>
          <button class="analysis-tab" type="button" role="tab" aria-selected="false" data-analysis-tab="response">分诊与行动</button>
        </div>

        <section id="analysisSection-diagnosis" class="analysis-section is-active">
          <div class="analysis-section-grid">
            <section class="panel panel-wide">
              <div class="panel-head">
                <h2>主导机制与过程证据</h2>
              </div>
              <div class="analysis-evidence-grid">
                <div class="analysis-pane">
                  <h3>主导因子</h3>
                  <div id="driverBars" class="bars"></div>
                </div>
                <div class="analysis-pane">
                  <h3>过程分解</h3>
                  <div id="processTable" class="table-wrap"></div>
                </div>
              </div>
            </section>

            <section class="panel panel-wide">
              <div class="panel-head">
                <h2>场景分诊与高优先事件</h2>
              </div>
              <div id="scenarioCounts" class="badge-row"></div>
              <div id="priorityTable" class="analysis-priority-list"></div>
            </section>
          </div>
        </section>

        <section id="analysisSection-thresholds" class="analysis-section" hidden>
          <div class="analysis-section-grid">
            <section class="panel">
              <div class="panel-head panel-head-inline">
                <h2>阈值检索</h2>
                <label class="compact-field">
                  <span>特征</span>
                  <select id="thresholdSelect"></select>
                </label>
              </div>
              <p id="thresholdSemantics" class="inline-note"></p>
              <div id="thresholdSnapshot" class="inline-metrics"></div>
              <div id="thresholdTable" class="table-wrap"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>边界摘要</h2>
              </div>
              <div id="boundaryMetrics" class="stats-grid stats-grid-2"></div>
              <div id="boundaryNotes" class="callout"></div>
            </section>
          </div>
        </section>

        <section id="analysisSection-response" class="analysis-section" hidden>
          <div class="analysis-section-grid">
            <section class="panel">
              <div class="panel-head">
                <h2>响应建议</h2>
              </div>
              <div id="playbookCards" class="stack"></div>
            </section>

            <section class="panel">
              <div class="panel-head">
                <h2>敏感性概览</h2>
              </div>
              <div id="sobolTable" class="analysis-sobol-grid"></div>
            </section>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/ui/js/main.js?v=20260605-modular-theme" defer></script>
</body>
</html>
