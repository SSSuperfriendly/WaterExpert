<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterExpert | 总览</title>
  <link rel="stylesheet" href="/ui/styles.css?v=20260605-modular-theme">
</head>
<body data-page="dashboard">
  <div class="workspace-shell">
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="关闭导航"></button>

    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="/ui/index.html">
          <span class="brand-mark">WE</span>
          <span class="brand-text">WaterExpert</span>
        </a>
      </div>
      <nav class="side-nav" aria-label="主导航">
        <a class="side-link active" href="/ui/index.html"><span class="side-link-index">01</span><span class="side-link-text">总览</span></a>
        <a class="side-link" href="/ui/data.html"><span class="side-link-index">02</span><span class="side-link-text">数据</span></a>
        <a class="side-link" href="/ui/jobs.html"><span class="side-link-index">03</span><span class="side-link-text">任务</span></a>
        <a class="side-link" href="/ui/analysis.html"><span class="side-link-index">04</span><span class="side-link-text">诊断</span></a>
      </nav>
      <div class="sidebar-foot">
        <p id="sidebarContext" class="sidebar-context">吴淞口</p>
      </div>
    </aside>

    <button id="sidebarEdgeToggle" class="edge-toggle" type="button" aria-label="折叠侧栏" title="折叠侧栏" data-state="expanded">
      <span class="toggle-glyph" aria-hidden="true"></span>
      <span class="sr-only">折叠侧栏</span>
    </button>

    <div class="content-shell">
      <header class="toolbar">
        <div class="toolbar-main">
          <button id="sidebarToggleMobile" class="sidebar-toggle mobile-only" type="button" aria-label="打开导航">导航</button>
          <div>
            <h1>总览</h1>
          </div>
        </div>
        <div class="toolbar-actions">
          <p id="runtimeMeta" class="runtime-meta"></p>
          <button id="themeToggleButton" class="button button-secondary theme-toggle" type="button" aria-label="切换到夜间模式" title="切换到夜间模式">夜间</button>
          <button id="refreshButton" class="button button-secondary">刷新</button>
          <button id="exportReportButton" class="button button-primary">导出报告</button>
        </div>
      </header>

      <div id="statusBanner" class="status-banner hidden"></div>

      <main class="dashboard-layout">
        <section class="panel panel-wide">
          <div class="panel-head">
            <h2>系统状态</h2>
            <p id="scopeLabel" class="scope-chip"></p>
          </div>
          <div id="overviewStats" class="stats-grid"></div>
          <div id="modelBadges" class="badge-row"></div>
          <div id="stationMeta" class="meta-grid"></div>
        </section>

        <div class="dashboard-detail-grid">
          <section class="panel emphasis-panel">
            <div class="panel-head">
              <h2>高优先事件</h2>
            </div>
            <div id="scenarioCounts" class="badge-row"></div>
            <div id="priorityFeed" class="priority-feed"></div>
          </section>

          <section class="panel panel-equal">
            <div class="panel-head panel-head-inline">
              <h2>风险解释</h2>
              <a class="text-link" href="/ui/analysis.html">详情</a>
            </div>
            <div id="driverBars" class="bars"></div>
          </section>
        </div>

        <section class="panel panel-wide chart-panel">
          <div class="panel-head panel-head-inline">
            <h2>预测快照</h2>
            <label class="compact-field">
              <span>模型</span>
              <select id="modelSelect"></select>
            </label>
          </div>
          <div class="chart-legend">
            <span><i class="swatch swatch-actual"></i>实测</span>
            <span><i class="swatch swatch-predicted"></i>预测</span>
            <span><i class="swatch swatch-risk"></i>风险</span>
          </div>
          <svg id="predictionChart" class="chart" viewBox="0 0 960 360" role="img" aria-label="Prediction chart"></svg>
          <div id="predictionSummary" class="inline-metrics"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/ui/js/main.js?v=20260605-modular-theme" defer></script>
</body>
</html>
