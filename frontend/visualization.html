<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterExpert | 数据可视化</title>
  <link rel="stylesheet" href="/ui/styles.css?v=20260625-goal-aligned">
</head>
<body data-page="visualization">
  <div class="workspace-shell">
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="关闭导航"></button>
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="/ui/index.html"><span class="brand-mark">WE</span><span class="brand-text">WaterExpert</span></a>
      </div>
      <nav class="side-nav" aria-label="系统菜单">
        <a class="side-link" href="/ui/index.html"><span class="side-link-index">01</span><span class="side-link-text">系统总览</span></a>
        <a class="side-link" href="/ui/database.html"><span class="side-link-index">02</span><span class="side-link-text">水质综合数据库</span></a>
        <a class="side-link" href="/ui/upload.html"><span class="side-link-index">03</span><span class="side-link-text">数据上传</span></a>
        <a class="side-link" href="/ui/preprocess.html"><span class="side-link-index">04</span><span class="side-link-text">数据预处理</span></a>
        <a class="side-link active" href="/ui/visualization.html"><span class="side-link-index">05</span><span class="side-link-text">数据可视化</span></a>
        <a class="side-link" href="/ui/prediction.html"><span class="side-link-index">06</span><span class="side-link-text">透明度预测与致因诊断</span></a>
      </nav>
      <div class="sidebar-foot"><p id="sidebarContext" class="sidebar-context">吴淞口可视化示例</p></div>
    </aside>
    <button id="sidebarEdgeToggle" class="edge-toggle" type="button" aria-label="折叠侧栏" title="折叠侧栏" data-state="expanded"><span class="toggle-glyph" aria-hidden="true"></span><span class="sr-only">折叠侧栏</span></button>

    <div class="content-shell">
      <header class="toolbar">
        <div class="toolbar-main">
          <button id="sidebarToggleMobile" class="sidebar-toggle mobile-only" type="button" aria-label="打开导航">导航</button>
          <div>
            <p class="eyebrow">系统总览 &gt; 数据可视化</p>
            <h1>数据可视化</h1>
          </div>
        </div>
        <div class="toolbar-actions">
          <p id="accountLabel" class="runtime-meta"></p>
          <button id="themeToggleButton" class="button button-secondary theme-toggle" type="button">夜间</button>
          <button id="logoutButton" class="button button-secondary">退出</button>
        </div>
      </header>

      <div id="visualStatus" class="status-banner hidden"></div>

      <main class="page-grid single-column">
        <section class="panel">
          <div class="panel-head"><h2>可视化输入</h2></div>
          <form id="visualFilterForm" class="form-grid">
            <label class="field">
              <span>站点</span>
              <select id="visualStationCode"></select>
            </label>
            <label class="field">
              <span>指标</span>
              <select id="visualIndicator"></select>
            </label>
            <div class="field actions-row">
              <span>&nbsp;</span>
              <button type="submit" class="button button-primary">更新图表</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>趋势图</h2></div>
          <div id="visualStats" class="stats-grid"></div>
          <svg id="visualChart" class="chart" viewBox="0 0 960 320" role="img" aria-label="visualization chart"></svg>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>张家浜跨模态融合</h2>
            <p class="panel-note">实地监测 + UAV 图片/视频 + 代理气象的日期级融合和模型前后对比</p>
          </div>
          <div id="crossModalStats" class="stats-grid"></div>
          <div id="crossModalEvaluationStats" class="stats-grid"></div>
          <div id="crossModalEvaluationTable" class="table-wrap"></div>
          <div id="crossModalGallery" class="media-gallery"></div>
          <div id="crossModalTable" class="table-wrap"></div>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>透明度相关性分析</h2></div>
          <div id="visualCorrelationTable" class="table-wrap"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/ui/js/visualization.js?v=20260625-goal-aligned" defer></script>
</body>
</html>
