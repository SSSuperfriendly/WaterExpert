<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WaterExpert | 数据上传</title>
  <link rel="stylesheet" href="/ui/styles.css?v=20260625-feedback">
</head>
<body data-page="upload">
  <div class="workspace-shell">
    <button id="sidebarScrim" class="sidebar-scrim" type="button" aria-label="关闭导航"></button>
    <aside class="sidebar">
      <div class="sidebar-top">
        <a class="brand" href="/ui/index.html"><span class="brand-mark">WE</span><span class="brand-text">WaterExpert</span></a>
      </div>
      <nav class="side-nav" aria-label="系统菜单">
        <a class="side-link" href="/ui/index.html"><span class="side-link-index">01</span><span class="side-link-text">系统总览</span></a>
        <a class="side-link" href="/ui/database.html"><span class="side-link-index">02</span><span class="side-link-text">水质综合数据库</span></a>
        <a class="side-link active" href="/ui/upload.html"><span class="side-link-index">03</span><span class="side-link-text">数据上传</span></a>
        <a class="side-link" href="/ui/preprocess.html"><span class="side-link-index">04</span><span class="side-link-text">数据预处理</span></a>
        <a class="side-link" href="/ui/visualization.html"><span class="side-link-index">05</span><span class="side-link-text">数据可视化</span></a>
        <a class="side-link" href="/ui/prediction.html"><span class="side-link-index">06</span><span class="side-link-text">透明度预测与致因诊断</span></a>
      </nav>
      <div class="sidebar-foot"><p id="sidebarContext" class="sidebar-context">数据上传</p></div>
    </aside>
    <button id="sidebarEdgeToggle" class="edge-toggle" type="button" aria-label="折叠侧栏" title="折叠侧栏" data-state="expanded"><span class="toggle-glyph" aria-hidden="true"></span><span class="sr-only">折叠侧栏</span></button>

    <div class="content-shell">
      <header class="toolbar">
        <div class="toolbar-main">
          <button id="sidebarToggleMobile" class="sidebar-toggle mobile-only" type="button" aria-label="打开导航">导航</button>
          <div>
            <p class="eyebrow">系统总览 &gt; 数据上传</p>
            <h1>数据上传</h1>
          </div>
        </div>
        <div class="toolbar-actions">
          <p id="accountLabel" class="runtime-meta"></p>
          <button id="themeToggleButton" class="button button-secondary theme-toggle" type="button">夜间</button>
          <button id="uploadRefreshButton" class="button button-secondary">刷新</button>
          <button id="logoutButton" class="button button-secondary">退出</button>
        </div>
      </header>

      <div id="uploadStatus" class="status-banner hidden"></div>

      <main class="page-grid single-column">
        <section class="panel">
          <div class="panel-head"><h2>上传文件</h2></div>
          <form id="uploadForm" class="form-grid">
            <label class="field">
              <span>数据类型</span>
              <select id="uploadDataType">
                <option value="water_quality">水质监测数据</option>
                <option value="weather">气象数据</option>
                <option value="hydrodynamics">水动力数据</option>
                <option value="boundary_labels">边界标签</option>
              </select>
            </label>
            <label class="field">
              <span>站点</span>
              <select id="uploadStationCode"></select>
            </label>
            <label class="field field-wide">
              <span>选择数据文件，可多选</span>
              <input id="uploadFiles" type="file" multiple accept=".csv,.xls,.xlsx,.json">
            </label>
            <div class="field field-wide">
              <span>上传进度</span>
              <div class="progress-shell">
                <div id="uploadProgressBar" class="progress-bar"></div>
              </div>
              <p id="uploadProgressText" class="muted">尚未开始上传。</p>
            </div>
            <div class="field actions-row">
              <span>&nbsp;</span>
              <div class="button-row">
                <button id="uploadSubmitButton" type="submit" class="button button-primary">保存数据文件</button>
                <button id="uploadResetButton" type="button" class="button button-secondary">清空已选文件</button>
              </div>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="panel-head"><h2>已上传数据文件</h2></div>
          <div id="uploadTable" class="table-wrap"></div>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="/ui/js/upload.js?v=20260625-feedback" defer></script>
</body>
</html>
