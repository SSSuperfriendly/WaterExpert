<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>500 · WaterExpert</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f8fafc;
    color: #0f172a;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    .card { background: #0f172a; border-color: #1e293b; }
    .sub { color: #94a3b8; }
  }
  .card {
    width: min(92vw, 440px);
    padding: 40px 36px;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    background: #ffffff;
    text-align: center;
    box-shadow: 0 10px 40px rgba(2, 6, 23, 0.06);
  }
  .code {
    font-size: 56px;
    font-weight: 700;
    line-height: 1;
    margin: 0 0 12px;
    background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
  .sub { font-size: 14px; line-height: 1.6; margin: 0 0 24px; color: #64748b; }
  .btn {
    display: inline-block;
    padding: 9px 20px;
    border-radius: 8px;
    background: #0ea5e9;
    color: #ffffff;
    font-size: 14px;
    text-decoration: none;
  }
  .btn:hover { background: #0284c7; }
</style>
</head>
<body>
  <main class="card">
    <p class="code">500</p>
    <p class="title">服务器内部错误</p>
    <p class="sub">请求处理过程中发生了未预期的错误，请稍后重试。<br />Internal server error. Please try again later.</p>
    <a class="btn" href="/ui/">返回总览</a>
  </main>
</body>
</html>
