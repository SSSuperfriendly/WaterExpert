name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend + model tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # frontend/out is a build product and is not committed, so the app's
      # /ui static mount is skipped when it is absent (backend/app/main.py).
      # e2e and frontend_static run in their own jobs where that applies.
      # agent/ has its own venv + requirements and is tested under that env;
      # it is ignored here (see agent/AGENT_LOCAL_RUN.md).
      - name: Run test suite (excluding e2e/frontend_static)
        run: >-
          python -m pytest -q
          --ignore=tests/e2e --ignore=tests/frontend_static --ignore=agent

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build static export
        working-directory: frontend
        run: npm run build

      # Static-export route + UTF-8 encoding guards; runs where out/ is fresh.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static export + encoding checks
        run: python -m unittest tests.frontend_static.test_frontend_static -v

  e2e:
    name: End-to-end business chain
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run end-to-end acceptance tests
        run: python -m pytest tests/e2e -q
