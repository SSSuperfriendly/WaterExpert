data_root: "data/raw"
water_pattern: "wusongkou_water_quality_2586.csv"
weather_filename: "shanghai_weather_daily.csv"
rag_artifacts_dir: "data/knowledge_graph"
output_dir: "outputs"

hydrodynamics:
  enabled: true
  source_path: "data/raw/shanghai_hydrodynamics.xls"
  wide_path: "outputs/hydrodynamics_preprocessed/shanghai_hydrodynamics_daily_wide.csv"
  output_dir: "outputs/hydrodynamics_preprocessed"

ndti:
  enabled: false
  source_dir: "data/ndti"
  output_dir: "outputs/ndti_preprocessed"

boundary_labels:
  enabled: true
  source_path: "data/raw/wusongkou_boundary_labels.csv"
  date_column: "date"
  label_column: "boundary_label"
  extent_ratio_column: "boundary_extent_ratio"
  extent_ratio_threshold: 0.5
  raster_proxy:
    provider: "DLR_GWP_P1D"
    center_lon: 121.522058
    center_lat: 31.392691
    aoi_half_size_deg: 0.03
    sampling_stride_days: 7
    dense_tail_days: 140
    boundary_label_quantile: 0.75
    boundary_label_min_ratio: 0.015
    minimum_positive_count: 18
    max_workers: 4

causal_discovery:
  enabled: true
  tau_max: 3
  pc_alpha: 0.2
  alpha_level: 0.05

history_days: 21
horizon_days: 1
train_ratio: 0.70
val_ratio: 0.15
batch_size: 32
epochs: 45
learning_rate: 0.0007
weight_decay: 0.0001
random_seed: 42
device: "auto"

loss:
  clearness_weight: 0.6
  physics_weight: 0.35
  change_weight: 0.35
  mechanism_weight: 0.18
  risk_weight: 0.0
  boundary_weight: 0.25
  risk_weight_mscim: 0.0
  risk_weight_mscim_no_kg: 0.0
  risk_weight_cmfbe: 0.08

auxiliary_targets:
  turbidity_surge_log_delta: 0.22
  turbidity_surge_ratio: 1.18
  clearness_drop_min: 0.04
  self_purification_drop_min: 0.03

model:
  hidden_dim: 64
  transformer_layers: 2
  num_heads: 4
  dropout: 0.10
